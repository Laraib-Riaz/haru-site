<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Connecting to Haru…</title>
<style>body{background:#0f1424;color:#fff7ed;font:16px system-ui,sans-serif;display:grid;place-items:center;height:100vh;margin:0}</style>
</head><body><p id="m">Connecting TikTok to Haru on your computer…</p>
<script>
// TikTok only returns sign-ins to an https address, so this public page
// hands the one-time code straight to Haru on this computer (port 8731,
// the same loopback catcher the Google and Meta sign-ins use). Nothing is
// stored here; the code is useless without the app secret on the laptop.
var q = location.search || "";
if (q.indexOf("code=") >= 0 || q.indexOf("error") >= 0) {
  location.replace("http://localhost:8731/tiktok" + q);
} else {
  document.getElementById("m").textContent = "Nothing to connect: open Haru and press Connect TikTok.";
}
</script></body></html>
